<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APEX VELOCITY – Ultimate Racing</title>
<style>
:root{--r:#e10600;--bg:#0a0a0d;--pn:rgba(10,10,14,.82);--bl:#2e9bff}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:'Arial Narrow',Arial,sans-serif;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
.h{position:fixed;pointer-events:none;background:var(--pn);border-left:4px solid var(--r);padding:6px 10px;font-size:13px;line-height:1.5}
#h1{top:calc(8px + env(safe-area-inset-top,0px));left:8px}
#h2{top:calc(8px + env(safe-area-inset-top,0px));right:8px;text-align:right;border-left:0;border-right:4px solid var(--bl)}
#h3{bottom:calc(10px + env(safe-area-inset-bottom,0px));left:8px;min-width:150px}
#mm{position:fixed;right:8px;top:calc(120px + env(safe-area-inset-top,0px));width:120px;height:90px;background:var(--pn);opacity:.9}
#spd{font-size:44px;font-weight:bold;font-style:italic;line-height:1}
#spd small{font-size:14px;color:#aaa}
#gear{font-size:28px;color:var(--r);font-weight:bold;float:right}
#rpmb{height:8px;background:#222;margin-top:4px}#rpmb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2e9bff,#fff,#e10600)}
#lights{position:fixed;top:25%;left:50%;transform:translateX(-50%);display:none;gap:10px;pointer-events:none}
#lights i{width:30px;height:30px;border-radius:50%;background:#300;border:2px solid #000}#lights i.on{background:#f10;box-shadow:0 0 18px #f10}
#msg{position:fixed;top:36%;left:0;right:0;text-align:center;font-size:clamp(28px,8vw,64px);font-weight:bold;font-style:italic;pointer-events:none;text-shadow:0 0 20px #000}
.ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#000 0,#1a0305 60%,#0a0f1a);padding:16px;text-align:center;overflow:auto}
.ov h1{margin:0;font-size:clamp(34px,9vw,72px);font-style:italic;letter-spacing:4px}.ov h1 b{color:var(--r)}
.ov h2{margin:0 0 14px;font-weight:normal;letter-spacing:8px;font-size:clamp(11px,2.6vw,16px);color:#aaa}
.gr{display:grid;grid-template-columns:auto auto;gap:6px 10px;text-align:left;margin:8px;align-items:center;font-size:15px}
select,button{font:inherit;background:#15151a;color:#fff;border:1px solid #444;padding:8px 12px;border-radius:3px}
button{background:var(--r);border:0;font-weight:bold;letter-spacing:2px;padding:12px 34px;margin:6px;cursor:pointer;font-size:17px}
button:hover{filter:brightness(1.2)}
#stats{font-size:12px;color:#aaa;max-width:340px}
table{border-collapse:collapse;margin:8px;font-size:15px}td{padding:3px 12px;border-bottom:1px solid #333}
#tc{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;display:none;pointer-events:none}
#tc b{position:absolute;bottom:0;width:78px;height:78px;border-radius:50%;background:#ffffff22;border:2px solid #fff5;display:flex;align-items:center;justify-content:center;font-size:22px;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="h" id="h1"></div><div class="h" id="h2"></div>
<canvas id="mm" width="240" height="180"></canvas>
<div class="h" id="h3"><span id="gear">N</span><div id="spd">0<small> km/h</small></div><div id="rpmb"><i id="rpm"></i></div><div id="tr" style="margin-top:4px"></div></div>
<div id="lights"><i></i><i></i><i></i><i></i><i></i></div><div id="msg"></div>
<div id="tc"><b id="tL" style="left:12px">◀</b><b id="tR" style="left:100px">▶</b><b id="tB" style="right:100px">▼</b><b id="tG" style="right:12px;background:#e1060088">▲</b></div>

<div class="ov" id="menu">
 <h1>APEX <b>VELOCITY</b></h1><h2>ULTIMATE FORMULA RACING</h2>
 <div class="gr">
  <span>Mode</span><select id="mode"><option value="gp">Grand Prix</option><option value="tt">Time Trial</option></select>
  <span>Mobil</span><select id="car"></select>
  <span>Jumlah lap</span><select id="laps"><option>1</option><option selected>3</option><option>5</option><option>8</option></select>
  <span>Kesulitan AI</span><select id="diff"><option value="0">Easy</option><option value="1" selected>Medium</option><option value="2">Hard</option><option value="3">Professional</option></select>
  <span>Ban awal</span><select id="tire"><option value="S">Soft</option><option value="M" selected>Medium</option><option value="H">Hard</option><option value="W">Wet</option></select>
  <span>Cuaca</span><select id="wx"><option value="sunny">Sunny</option><option value="cloudy">Cloudy</option><option value="rain">Rain</option><option value="heavy">Heavy Rain</option><option value="fog">Fog</option><option value="dyn">Dinamis</option></select>
  <span>Grafis</span><select id="gfx"><option value="1">High</option><option value="0">Performance</option></select>
 </div>
 <div id="stats"></div>
 <button id="go">PLAY</button>
 <p style="font-size:12px;color:#888;max-width:480px;line-height:1.5">↑/W gas · ↓/S rem · ←→/A D belok · C ganti kamera · T pilih ban pit · M mute<br>Pit stop: berhenti di kotak PIT biru (di sisi lurus start) selama 3 detik.</p>
</div>
<div class="ov" id="res" style="display:none"><h1 id="rt">HASIL</h1><table id="rtab"></table><div id="rb"></div><button id="again">MENU UTAMA</button></div>

<script>
(()=>{
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),mm=$('mm'),m2=mm.getContext('2d');
let vw,vh;function rs(){const d=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=vw*d;cv.height=vh*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();
const touch=matchMedia('(pointer:coarse)').matches;if(touch)$('tc').style.display='block';

/* ---------- TRACK (Nusantara International Grand Circuit, layout original) ---------- */
const P=[[0,0],[500,0],[1000,0],[1400,-50],[1650,-250],[1650,-550],[1400,-750],[1000,-700],[800,-500],[500,-450],[300,-650],[0,-700],[-300,-550],[-350,-250],[-250,-50]].map(p=>[p[0]*3,p[1]*3]);
const TW=150;
let D=[];for(let i=0;i<P.length;i++){const a=P[(i+P.length-1)%P.length],b=P[i],c=P[(i+1)%P.length],d=P[(i+2)%P.length];
 for(let t=0;t<1;t+=1/60){const t2=t*t,t3=t2*t,f=k=>.5*(2*b[k]+(-a[k]+c[k])*t+(2*a[k]-5*b[k]+4*c[k]-d[k])*t2+(-a[k]+3*b[k]-3*c[k]+d[k])*t3);D.push([f(0),f(1)])}}
const T=[D[0]];for(const p of D)if(Math.hypot(p[0]-T[T.length-1][0],p[1]-T[T.length-1][1])>=14)T.push(p);
const N=T.length,STEP=14,mod=i=>(i%N+N)%N;
const nA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const ANG=T.map((_,i)=>{const a=T[mod(i-1)],b=T[mod(i+1)];return Math.atan2(b[1]-a[1],b[0]-a[0])});
let VM=T.map((_,i)=>{const da=Math.abs(nA(ANG[mod(i+4)]-ANG[mod(i-4)])),k=da/(8*STEP)+1e-6;return Math.min(900,Math.sqrt(300/k))});
VM=VM.map((_,i)=>{let s=0;for(let j=-5;j<=5;j++)s+=VM[mod(i+j)];return s/11});
const TRK=new Path2D();T.forEach((p,i)=>i?TRK.lineTo(p[0],p[1]):TRK.moveTo(p[0],p[1]));TRK.closePath();
const PIT={x:0,y:0,a:ANG[N-6]};{const i=N-8,l=[Math.sin(ANG[i]),-Math.cos(ANG[i])];PIT.x=T[i][0]+l[0]*(TW/2+75);PIT.y=T[i][1]+l[1]*(TW/2+75);PIT.a=ANG[i]}
let sd=11;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const TREES=[];for(let n=0;n<900&&TREES.length<420;n++){const x=-1600+rnd()*6200,y=-2800+rnd()*3200;let ok=true;for(let i=0;i<N;i+=3)if(Math.hypot(T[i][0]-x,T[i][1]-y)<TW/2+170){ok=false;break}if(ok)TREES.push([x,y,14+rnd()*14])}

/* ---------- DATA ---------- */
const CARS=[['Falcon FX1','#e10600',520,260,1,900],['Orion Z7','#2e9bff',540,240,.95,950],['Kestrel K3','#ffc400',500,290,1.05,880],['Vortex V9','#18c964',510,250,1.12,920],['Nova N5','#d8d8e0',530,270,.98,900]];
CARS.forEach((c,i)=>$('car').add(new Option(c[0],i)));
const showStats=()=>{const c=CARS[$('car').value];$('stats').textContent=`Top speed ${Math.round(c[2]*.62)} km/h · Akselerasi ${c[3]} · Handling ${Math.round(c[4]*100)} · Rem ${c[5]}`};$('car').onchange=showStats;showStats();
const TN={S:'SOFT',M:'MEDIUM',H:'HARD',W:'WET'},TC={S:'#e10600',M:'#ffc400',H:'#eee',W:'#2e9bff'};
const BASE={S:1.04,M:1,H:.96,W:.84},WR={S:1.6,M:1,H:.6};
const WX={sunny:['SUNNY',1],cloudy:['CLOUDY',.98],rain:['RAIN',.8],heavy:['HEAVY RAIN',.68],fog:['FOG',.96]};
const AINAMES=['Sato','Rossi','Mbeki','Duarte','Kowal','Nguyen','Haddad','Larsen','Okoye','Pratama','Silva'];
const fmt=t=>t==null||!isFinite(t)?'--:--.---':Math.floor(t/60)+':'+(t%60).toFixed(3).padStart(6,'0');

/* ---------- STATE ---------- */
let st='menu',cars=[],pl,cfg,wx='sunny',wTimer=0,clock=0,cd=0,camMode=0,go=0,pitT=0,msgT=0;
const K={};let tL=0,tR=0,tB=0,tG=0;
const gm=()=>WX[wx][1];
const rainy=()=>wx=='rain'||wx=='heavy';
function tireGrip(c){let b=BASE[c.tire];b=rainy()?(c.tire=='W'?b*1.28:b*.95):(c.tire=='W'?b*.88:b);return b*(1-.35*c.wear/100)}
function mk(slot,name,col,top,acc,grip,brk,ai,sk){
 const row=slot>>1,i=mod(N-4-row*4),side=slot%2?1:-1,a=ANG[i],r=[-Math.sin(a),Math.cos(a)];
 return{name,col,top,acc,grip,brk,ai,sk,x:T[i][0]+r[0]*28*side,y:T[i][1]+r[1]*28*side,a,vx:0,vy:0,idx:i,lap:0,v:0,wear:0,dmg:0,tire:'M',off:(Math.random()-.5)*50,lapT:0,best:Infinity,fin:null,num:slot+1,sec:0,secT:0,secs:[null,null,null],ls:[null,null,null],thr:0,brk2:0,steer:0,slide:0,dist:0}}
function startRace(){
 cfg={mode:$('mode').value,laps:+$('laps').value,diff:+$('diff').value,gfx:+$('gfx').value};
 const pc=CARS[$('car').value];cars=[];
 const slots=cfg.mode=='tt'?[0]:[...Array(12).keys()];const ps=cfg.mode=='tt'?0:6;
 for(const s of slots){if(s==ps){pl=mk(s,'Kamu',pc[1],pc[2],pc[3],pc[4],pc[5],false);pl.tire=$('tire').value;cars.push(pl)}
  else{const b=CARS[(s*7)%5],f=.94+Math.random()*.06;const c=mk(s,AINAMES[s%AINAMES.length],`hsl(${(s*67)%360},70%,55%)`,b[2]*f,b[3]*f,b[4],b[5],true,[.8,.88,.95,1][cfg.diff]*(.97+Math.random()*.05));cars.push(c)}}
 wx=$('wx').value=='dyn'?'sunny':$('wx').value;wTimer=0;clock=0;pitT=0;
 st='grid';cd=0;go=1.2+Math.random()*1.2;$('lights').style.display='flex';[...$('lights').children].forEach(l=>l.className='');
 $('menu').style.display='none';$('res').style.display='none';audio();setMsg('SIAP...');lastSt=performance.now()}
let lastSt=0;
$('go').onclick=startRace;$('again').onclick=()=>{$('res').style.display='none';$('menu').style.display='flex';st='menu'};
function setMsg(t,d=1.8){$('msg').textContent=t;msgT=d}

/* ---------- INPUT / AUDIO ---------- */
addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;const k=e.key.toLowerCase();if(k=='c')camMode=(camMode+1)%3;if(k=='t'&&pl){pl.next=pl.next=='S'?'M':pl.next=='M'?'H':pl.next=='H'?'W':'S';setMsg('Ban pit: '+TN[pl.next],1.2)}if(k=='m'&&gA)gA.gain.value=gA.gain.value?0:.015;if(k.startsWith('arrow')||k==' ')e.preventDefault()});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
[['tL','L'],['tR','R'],['tB','B'],['tG','G']].forEach(([id,k])=>{const e=$(id),s=v=>ev=>{ev.preventDefault();({L:()=>tL=v,R:()=>tR=v,B:()=>tB=v,G:()=>tG=v})[k]()};e.ontouchstart=s(1);e.ontouchend=s(0);e.onmousedown=s(1);e.onmouseup=s(0)});
let ac,eo,gA,ef;
function audio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();eo=ac.createOscillator();eo.type='triangle';ef=ac.createBiquadFilter();ef.frequency.value=400;gA=ac.createGain();gA.gain.value=.015;eo.connect(ef);ef.connect(gA);gA.connect(ac.destination);eo.start()}catch(e){}}
function beep(f,d=.25){if(!ac)return;const o=ac.createOscillator(),q=ac.createGain();o.frequency.value=f;q.gain.value=.02;q.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(q);q.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}

/* ---------- PHYSICS ---------- */
function nearest(c){let b=1e18,bi=c.idx;for(let j=-40;j<=40;j++){const i=mod(c.idx+j),dx=T[i][0]-c.x,dy=T[i][1]-c.y,d=dx*dx+dy*dy;if(d<b){b=d;bi=i}}return[bi,Math.sqrt(b)]}
function phys(c,dt){
 const co=Math.cos(c.a),si=Math.sin(c.a);let vf=c.vx*co+c.vy*si,vl=-c.vx*si+c.vy*co;
 const tg=c.ai?(rainy()?BASE.W*1.2:1)*c.sk:tireGrip(c),G=gm()*tg*c.grip,pw=1-c.dmg*.004;
 const off=c.dist>TW/2+8;
 if(c.thr>0)vf+=c.acc*pw*c.thr*(1-Math.max(0,vf)/(c.top*pw))*dt*(off?.4:1);
 if(c.brk2>0){if(vf>0)vf=Math.max(0,vf-c.brk*G*c.brk2*dt);else vf=Math.max(-70,vf-200*dt)}
 vf-=vf*Math.abs(vf)*.00004*dt*60*.15; // aero drag
 if(off)vf*=Math.exp(-(c.ai?.4:.9)*dt);
 const dfc=1+Math.max(0,vf)/700;let grip=7*G*dfc*(off?.55:1);
 const tr=2.7/(1+Math.abs(vf)/330)*Math.min(1,Math.abs(vf)/70)*(.55+.45*Math.min(1.1,G));
 c.a+=c.steer*tr*(vf>=0?1:-1)*dt;
 c.slide=Math.abs(vl);vl*=Math.exp(-grip*dt);
 const co2=Math.cos(c.a),si2=Math.sin(c.a);c.vx=vf*co2-vl*si2;c.vy=vf*si2+vl*co2;c.v=Math.hypot(c.vx,c.vy);c.vf=vf;
 c.x+=c.vx*dt;c.y+=c.vy*dt;
 // walls
 if(c.dist>TW/2+90){const t=T[c.idx],dx=t[0]-c.x,dy=t[1]-c.y,d=Math.hypot(dx,dy);c.x+=dx/d*(c.dist-TW/2-90);c.y+=dy/d*(c.dist-TW/2-90);c.vx*=.4;c.vy*=.4;if(!c.ai)c.dmg=Math.min(100,c.dmg+4)}
 if(!c.ai&&st=='race'){const w=(.12+c.slide*.012+Math.abs(c.steer)*Math.abs(vf)*.0004)*(WR[c.tire]||(rainy()?.8:2.2));c.wear=Math.min(100,c.wear+w*dt*(c.brk2>.5?1.6:1)*1.4)}
}
function aiCtl(c){
 const look=5+Math.floor(c.v/32),ti=mod(c.idx+look),r=[-Math.sin(ANG[ti]),Math.cos(ANG[ti])];
 const tx=T[ti][0]+r[0]*c.off,ty=T[ti][1]+r[1]*c.off;
 c.steer=Math.max(-1,Math.min(1,nA(Math.atan2(ty-c.y,tx-c.x)-c.a)*2.4));
 let tv=1e9;for(let j=0;j<30;j++){const v=Math.sqrt(VM[mod(c.idx+j)]**2+2*c.brk*.55*c.sk*j*STEP);if(v<tv)tv=v}
 tv=Math.min(tv*Math.sqrt(gm()*c.grip)*c.sk,c.top*c.sk*(gm()>.9?1:.85));
 for(const o of cars){if(o===c)continue;const dx=o.x-c.x,dy=o.y-c.y,f=dx*Math.cos(c.a)+dy*Math.sin(c.a),s=-dx*Math.sin(c.a)+dy*Math.cos(c.a);
  if(f>0&&f<90&&Math.abs(s)<30){c.off+=(s>0?-1:1)*60*.016;tv=Math.min(tv,o.v+(f-45)*.8)}}
 c.off=Math.max(-TW/2+22,Math.min(TW/2-22,c.off));
 c.thr=Math.max(0,Math.min(1,(tv-c.v)/25));c.brk2=c.v>tv+8?Math.min(1,(c.v-tv)/70):0}

/* ---------- LOOP ---------- */
let last=performance.now(),bestAll=Infinity;
function lapDone(c){const t=clock-c.lapT;c.lapT=clock;if(c.lap>=2){if(t<c.best)c.best=t;if(t<bestAll){bestAll=t;if(!c.ai)setMsg('FASTEST LAP '+fmt(t),2.2)}}}
function update(dt){
 clock+=dt;
 if(st=='grid'){cd+=dt;const n=Math.min(5,Math.floor(cd));[...$('lights').children].forEach((l,i)=>l.className=i<n?'on':'');if(n!=this_n){this_n=n;if(n&&n<=5)beep(440,.2)}
  if(cd>=5+go){st='race';clock=0;cars.forEach(c=>c.lapT=0);$('lights').style.display='none';setMsg('GO!',1.2);beep(880,.5);bestAll=Infinity}
  cars.forEach(c=>{[c.idx,c.dist]=nearest(c)});return}
 if(cfg.mode=='gp'&&wx!=null&&$('wx').value=='dyn'){wTimer+=dt;if(wTimer>30){wTimer=0;const o=['sunny','cloudy','rain','heavy','fog'];wx=o[Math.floor(Math.random()*5)];setMsg('Cuaca: '+WX[wx][0],2.5)}}
 for(const c of cars){
  if(c===pl){c.steer=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0)+tR-tL;c.thr=(K.w||K.arrowup||tG)?1:0;c.brk2=(K.s||K.arrowdown||tB)?1:0;if(st=='done'){c.thr=0;c.brk2=.4}
   // pit
   if(Math.hypot(c.x-PIT.x,c.y-PIT.y)<60&&c.v<40&&st=='race'){pitT+=dt;c.brk2=1;setMsg('PIT STOP '+Math.max(0,3-pitT).toFixed(1),.3);if(pitT>=3){pitT=0;c.tire=c.next||c.tire;c.wear=0;c.dmg=0;setMsg('PIT SELESAI – '+TN[c.tire],1.6);beep(600,.3)}}else pitT=0}
  else if(c.fin&&st=='race'||st=='done'&&c.ai&&false){}else aiCtl(c);
  if(c===pl)c.dist=c.dist;
  const old=c.idx;[c.idx,c.dist]=nearest(c);
  if(old>N*.75&&c.idx<N*.25){c.lap++;if(c.lap>=2)lapDone(c);if(c.lap==1){c.lapT=clock}if(c.lap>cfg.laps&&!c.fin){c.fin=clock;if(c===pl){st='done';setMsg('CHEQUERED FLAG!',3);setTimeout(showRes,2500)}}}
  else if(old<N*.25&&c.idx>N*.75)c.lap--;
  const s=Math.min(2,Math.floor(c.idx/(N/3)));if(s!=c.sec){if(s==c.sec+1||(s==0&&c.sec==2)){if(s==0)c.ls=c.secs.slice(),c.secs=[null,null,null];else c.secs[c.sec]=clock-c.secT;if(c===pl&&s>0)setMsg('S'+s+' '+fmt(c.secs[c.sec]),1.2)}c.sec=s;c.secT=clock}
  phys(c,dt)}
 // car-car collision
 for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<26&&d>.01){const p=(26-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const im=rv*.6;a.vx+=nx*im;a.vy+=ny*im;b.vx-=nx*im;b.vy-=ny*im;if(a===pl||b===pl)pl.dmg=Math.min(100,pl.dmg+Math.abs(rv)*.05)}}}
}
let this_n=-1;
function prog(c){return c.lap*N+c.idx}
function order(){return cars.slice().sort((a,b)=>(a.fin&&b.fin)?a.fin-b.fin:a.fin?-1:b.fin?1:prog(b)-prog(a))}
function showRes(){
 const o=order();$('rt').innerHTML='HASIL <b style="color:#e10600">BALAPAN</b>';
 $('rtab').innerHTML='<tr><td>P</td><td>Pembalap</td><td>Waktu/Lap</td><td>Best</td></tr>'+o.map((c,i)=>`<tr style="color:${c===pl?'#ffc400':'#fff'}"><td>${i+1}</td><td>${c.name}</td><td>${c.fin?fmt(c.fin):'Lap '+Math.max(1,c.lap)}</td><td>${fmt(c.best)}</td></tr>`).join('');
 const p=o.indexOf(pl)+1;$('rb').innerHTML=`<p>Posisi akhir: <b>P${p}</b>${p<=3?' 🏆 PODIUM!':''} · Fastest lap: ${fmt(bestAll)}</p>`;
 $('res').style.display='flex';st='menu'}

/* ---------- RENDER ---------- */
function drawCar(c){
 g.save();g.translate(c.x,c.y);g.rotate(c.a);
 g.fillStyle='#111';[[-12,-11],[-12,7],[11,-11],[11,7]].forEach(w=>g.fillRect(w[0]-5,w[1],10,5));
 g.fillStyle=c.col;g.fillRect(-20,-8,6,16);                      // rear wing
 g.fillStyle='#111';g.fillRect(-21,-9,2,18);
 g.fillStyle=c.col;g.beginPath();g.moveTo(-16,-5);g.lineTo(6,-4);g.lineTo(22,-1.5);g.lineTo(22,1.5);g.lineTo(6,4);g.lineTo(-16,5);g.fill();
 g.fillRect(-4,-9,12,3);g.fillRect(-4,6,12,3);                     // sidepods
 g.fillStyle='#111';g.fillRect(19,-9,4,18);                        // front wing
 g.fillStyle='#fff';g.beginPath();g.arc(-1,0,3.2,0,7);g.fill();
 g.strokeStyle='#222';g.lineWidth=1.2;g.beginPath();g.arc(-1,0,4.5,-1.2,1.2);g.stroke();
 if(c===pl&&c.brk2>0){g.fillStyle='#f22';g.fillRect(-18,-3,2,6)}
 g.restore()}
function draw(){
 const w=gm(),f=pl||cars[0];if(!f)return;
 const sp=f.v/f.top,zm=Math.max(.55,Math.min(1,vw/1000))*(camMode==1?.8:camMode==2?.9:1)*(.9-.28*sp);
 g.fillStyle=rainy()?'#1f3a26':'#2b5a2c';g.fillRect(0,0,vw,vh);
 g.save();g.translate(vw/2,vh*(camMode==0?.66:.7));g.rotate(-f.a-Math.PI/2);g.scale(zm,zm);g.translate(-f.x,-f.y);
 const vr=Math.hypot(vw,vh)/zm;
 g.fillStyle='#1b4a22';for(const t of TREES)if(Math.abs(t[0]-f.x)<vr&&Math.abs(t[1]-f.y)<vr){g.beginPath();g.arc(t[0],t[1],t[2],0,7);g.fill()}
 g.lineJoin='round';g.setLineDash([]);
 g.strokeStyle='#e8e8e8';g.lineWidth=TW+34;g.stroke(TRK);
 g.strokeStyle='#d01010';g.setLineDash([36,36]);g.stroke(TRK);g.setLineDash([]);
 g.strokeStyle=rainy()?'#1a1c22':'#34363b';g.lineWidth=TW;g.stroke(TRK);
 g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=3;g.setLineDash([50,70]);g.stroke(TRK);g.setLineDash([]);
 // start line & pit & grandstand
 const s0=T[0],a0=ANG[0];g.save();g.translate(s0[0],s0[1]);g.rotate(a0);for(let i=0;i<10;i++)for(let j=0;j<2;j++){g.fillStyle=(i+j)%2?'#fff':'#000';g.fillRect(j*8-8,-TW/2+i*15,8,15)}g.restore();
 g.save();g.translate(PIT.x,PIT.y);g.rotate(PIT.a);g.fillStyle='#14304f';g.fillRect(-90,-40,180,80);g.strokeStyle='#2e9bff';g.lineWidth=4;g.strokeRect(-90,-40,180,80);g.fillStyle='#fff';g.font='bold 30px Arial';g.fillText('PIT',-20,10);
 g.fillStyle='#222';g.fillRect(-220,-110,440,50);for(let i=0;i<8;i++){g.fillStyle=['#e10600','#2e9bff','#ffc400','#18c964'][i%4];g.fillRect(-210+i*52,-100,40,30)}g.restore();
 {const i=40,l=[-Math.sin(ANG[i]),Math.cos(ANG[i])];g.save();g.translate(T[i][0]+l[0]*(TW/2+110),T[i][1]+l[1]*(TW/2+110));g.rotate(ANG[i]);g.fillStyle='#333';g.fillRect(-300,-50,600,100);
  if(cfg&&cfg.gfx)for(let k=0;k<120;k++){g.fillStyle=`hsl(${(k*53)%360},60%,55%)`;g.fillRect(-290+(k%40)*14.5,-40+Math.floor(k/40)*26,6,6)}
  g.fillStyle='#e10600';g.fillRect(-300,-62,600,12);g.restore()}
 if(cfg&&cfg.gfx&&sp>.5){g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=2;for(let k=0;k<8;k++){const a=f.a+Math.PI+(k-3.5)*.07;g.beginPath();g.moveTo(f.x-Math.cos(f.a)*30,f.y-Math.sin(f.a)*30);g.lineTo(f.x+Math.cos(a)*90,f.y+Math.sin(a)*90);g.stroke()}}
 // tire marks / spray
 for(const c of cars){if(c.slide>60&&cfg&&cfg.gfx){g.fillStyle=rainy()?'rgba(200,220,255,.4)':'rgba(220,220,220,.4)';for(let k=0;k<3;k++){g.beginPath();g.arc(c.x-Math.cos(c.a)*22+(Math.random()-.5)*14,c.y-Math.sin(c.a)*22+(Math.random()-.5)*14,5+Math.random()*5,0,7);g.fill()}}drawCar(c)}
 g.restore();
 // weather overlays
 if(rainy()){g.strokeStyle='rgba(180,200,230,.5)';g.lineWidth=1;g.beginPath();const n=cfg&&cfg.gfx?(wx=='heavy'?260:140):60;for(let i=0;i<n;i++){const x=(i*137.5+performance.now()*.5)%vw,y=(i*91.3+performance.now()*1.2)%vh;g.moveTo(x,y);g.lineTo(x-4,y+16)}g.stroke();g.fillStyle='rgba(15,25,45,.2)';g.fillRect(0,0,vw,vh)}
 if(wx=='fog'||wx=='cloudy'){g.fillStyle=wx=='fog'?'rgba(190,195,205,.45)':'rgba(40,50,70,.12)';g.fillRect(0,0,vw,vh)}
 const gr=g.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.35,vw/2,vh/2,Math.max(vw,vh)*.8);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=gr;g.fillRect(0,0,vw,vh);
 if(f.v>f.top*.9&&cfg&&cfg.gfx){g.fillStyle='rgba(255,255,255,.04)';g.fillRect(0,0,vw,vh)}
}
function drawMini(){
 m2.clearRect(0,0,240,180);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;T.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
 const s=Math.min(220/(x1-x0),160/(y1-y0)),X=x=>10+(x-x0)*s,Y=y=>10+(y-y0)*s;
 m2.strokeStyle='#999';m2.lineWidth=5;m2.beginPath();T.forEach((p,i)=>i?m2.lineTo(X(p[0]),Y(p[1])):m2.moveTo(X(p[0]),Y(p[1])));m2.closePath();m2.stroke();
 cars.forEach(c=>{m2.fillStyle=c===pl?'#ffc400':'#e10600';m2.beginPath();m2.arc(X(c.x),Y(c.y),c===pl?5:3,0,7);m2.fill()})}
function hud(){
 const f=pl;if(!f)return;const o=order(),pos=o.indexOf(f)+1;
 const kmh=Math.max(0,Math.round(f.v*.62));const gearN=f.vf<-3?'R':f.v<3?'N':Math.min(8,1+Math.floor(f.vf/f.top*8));
 const fr=f.vf/f.top*8%1,rp=f.v<3?.15+f.thr*.3:.45+.55*Math.min(1,fr);
 $('spd').innerHTML=kmh+'<small> km/h</small>';$('gear').textContent=gearN;$('rpm').style.width=Math.min(100,rp*100)+'%';
 if(eo&&ac){eo.frequency.value=55+rp*210;ef.frequency.value=300+f.thr*400+rp*400}
 $('h1').innerHTML=`<b style="font-size:18px">P${pos}</b>/${cars.length}<br>LAP ${Math.min(Math.max(f.lap,1),cfg.laps)}/${cfg.laps}<br>${fmt(st=='grid'?0:clock)}`;
 $('h2').innerHTML=`${WX[wx][0]}<br>Best ${fmt(f.best)}<br>S1 ${fmt(f.secs[0]??f.ls[0])}<br>S2 ${fmt(f.secs[1]??f.ls[1])}<br>S3 ${fmt(f.secs[2]??f.ls[2])}`;
 $('tr').innerHTML=`<span style="color:${TC[f.tire]}">● ${TN[f.tire]}</span> ${Math.round(100-f.wear)}%<br>DMG ${Math.round(f.dmg)}% · CAM ${['COCKPIT','CHASE','FRONT'][camMode]}<br><span style="color:#888">Next pit: ${TN[f.next||f.tire]}</span>`}
function tick(ts){const dt=Math.min(.033,(ts-last)/1000);last=ts;
 if(st!='menu'){update(dt);draw();drawMini();hud();if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent=''}}else{g.fillStyle='#000';g.fillRect(0,0,vw,vh)}
 requestAnimationFrame(tick)}
requestAnimationFrame(tick);
})();
</script>
